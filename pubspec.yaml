name: bujuan_music
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  flutter_screenutil: ^5.9.3

  palette_generator:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      ref: master
      path: packages/palette_generator

  riverpod_annotation: ^2.6.1
  bujuan_music_api:
    path: ./plugin/bujuan_music_api

  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_path_provider-v2.1.5_ohos
      path: packages/path_provider/path_provider

  path_provider_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_path_provider-v2.1.5_ohos
      path: packages/path_provider/path_provider_ohos

  cached_network_image: ^3.2.3
  hugeicons: ^0.0.7
  get_it: ^8.0.3

  audioplayers:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_audioplayers.git
      path: packages/audioplayers

  audio_service:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_audio_service.git
      path: audio_service

  audio_session:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_audio_session.git

  flutter_zoom_drawer: ^3.2.0
  pinput:
    path: ./plugin/pinput-5.0.2-ohos
  qr_flutter: ^4.1.0
  #window_manager: ^0.5.0
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  sheetify: ^1.0.2
  bottom_sheet_scaffold: ^0.1.9
  shadex: ^1.0.2
  fluid_background: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/flutter_lints

  build_runner:
  custom_lint:
  riverpod_generator: ^2.6.4
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_path_provider-v2.1.5_ohos
      path: packages/path_provider/path_provider
  path_provider_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: br_path_provider-v2.1.5_ohos
      path: packages/path_provider/path_provider_ohos
  file: ^7.0.0
  uuid: ^4.4.2
  http: ^1.2.2
  rxdart: ^0.28.0