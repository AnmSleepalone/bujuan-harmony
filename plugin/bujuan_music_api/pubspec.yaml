name: bujuan_music_api
description: A comprehensive Netease Cloud Music API client for Flutter. Works with all API-unavailable branches.
version: 1.0.0
homepage: https://github.com/2697a/bujuan

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP客户端
  dio: ^5.2.1+1

  # Cookie管理
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.8

  # 加密库
  encrypt: ^5.0.1
  pointycastle: ^3.7.3

  # JSON序列化
  json_annotation: ^4.8.0

  # 日志（可选，开发时使用）
  pretty_dio_logger: ^1.3.1

  # 路径管理
  path_provider: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

  # JSON代码生成
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
